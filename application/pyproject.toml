[project]
name = "odysafe-url"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "XlsxWriter>=3.2,<4",
  "Pillow>=11,<13",
  "dnspython[doh]>=2.8,<3",
  "fastapi>=0.115,<0.116",
  "httpx>=0.28,<1",
  "har2tree @ file:repo/har2tree",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.34,<0.35",
  "yara-x>=1.22,<2",
]

[project.optional-dependencies]
test = ["httpx>=0.28,<1", "pytest>=8", "pytest-asyncio>=0.24"]
capture = ["PlaywrightCapture @ file:repo/PlaywrightCapture"]

[tool.setuptools]
packages = ["app", "app.capture", "app.analyzers", "app.reporting", "app.storage", "app.sandbox", "app.database", "app.rules", "app.web", "app.ioc", "app.dns", "app.orchestration"]

[tool.setuptools.package-data]
"app.capture" = ["js/*.js"]
"app.web" = ["templates/*.html", "static/*", "locales/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: tests requiring a locally installed Chromium"]
