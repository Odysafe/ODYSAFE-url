http_port 3128

acl Safe_ports port 80 443
acl SSL_ports port 443
acl CONNECT method CONNECT
acl forbidden_names dstdomain localhost .local .internal .home.arpa
acl forbidden_v4 dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8
acl forbidden_v4 dst 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24
acl forbidden_v4 dst 192.88.99.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24
acl forbidden_v4 dst 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4
acl forbidden_v6 dst ::/128 ::1/128 64:ff9b::/96 100::/64 2001:2::/48
acl forbidden_v6 dst 2001:10::/28 2001:db8::/32 fc00::/7 fe80::/10 ff00::/8

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny forbidden_names
http_access deny to_localhost
http_access deny to_linklocal
http_access deny forbidden_v4
http_access deny forbidden_v6
http_access allow all
http_access deny all

cache deny all
pinger_enable off
via off
forwarded_for delete
request_header_access X-Forwarded-For deny all
request_header_access Via deny all
reply_header_access Server deny all

access_log stdio:/dev/stdout
cache_log /dev/stderr
cache_store_log none
pid_filename none
coredump_dir /tmp
visible_hostname odysafe-internet-proxy
